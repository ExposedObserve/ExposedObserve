name: exposed-observe-dev
services:
  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.7
    container_name: exposed-observe-mock-oauth2
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
    # The container ships with a default client (oidc-client) and a
    # static user (navikt) configured to issue an id_token whose
    # email is the username. With `interactiveLogin: true` (the
    # default), the first visit to the provider lets you type the
    # user email and pick the groups to include as the `groups`
    # claim. To pin a fixed user/groups for tests, set
    # `JSON_CONFIG=/path/to/config.json` and mount the file in.
  redis:
    image: redis:7-alpine
    container_name: exposed-observe-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Used by the OIDC session store. Sessions are signed cookies by
    # default; setting OIDC_SESSION_STORE=redis moves the opaque id
    # into Redis so multiple openobserve instances can share it.
  nats:
    image: nats:2.10-alpine
    container_name: exposed-observe-nats
    ports:
      - "4222:4222"
    command: ["nats-server", "--jetstream", "--store_dir=/data"]
    volumes:
      - nats-data:/data
    # The openobserve backend job runtime talks to NATS for queue
    # fan-out and uses JetStream KV buckets for cluster coordination.
    # A single-node deployment works with the default configuration;
    # no auth or clustering flags needed for dev.

volumes:
  nats-data:

