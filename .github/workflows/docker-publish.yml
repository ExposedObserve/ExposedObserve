name: Build and Push

on:
  push:
    branches: [ "master", "eo-dev" , "eo-dev-*" ]
    tags: [ "eo-v*.*.*" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Determine version and Docker tags
        id: meta
        run: |
          IMAGE_NAME=${GITHUB_REPOSITORY,,}
          IMAGE="${{ env.REGISTRY }}/${IMAGE_NAME}"
          TAGS=""

          REF="${{ github.ref }}"
          SHA_SHORT="${GITHUB_SHA::8}"

          GIT_VERSION=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "v0.0.0")

          if [[ "$REF" == refs/tags/eo-v* ]]; then
            VERSION_RAW="${REF#refs/tags/eo-v}"
            TAGS+="$IMAGE:$VERSION_RAW,"
            if [[ "$VERSION_RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              TAGS+="$IMAGE:latest,"
            fi

          elif [[ "$REF" == refs/heads/master ]]; then
            TAGS+="$IMAGE:latest,"

          elif [[ "$REF" == refs/heads/eo-dev ]]; then
            TAGS+="$IMAGE:dev,$IMAGE:nightly,"

          fi

          TAGS+="$IMAGE:sha-$SHA_SHORT"
          TAGS=${TAGS%,}

          echo "git_version=$GIT_VERSION" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Generated tags: $TAGS"
          echo "Using GIT_VERSION: $GIT_VERSION"

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cache Node
        uses: actions/cache@v5
        id: cache-npm
        with:
          path: |
            cache-npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
       
      - name: Cache Node
        uses: actions/cache@v5
        id: cache-node
        with:
          path: |
            cache-node
            cache-vite
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json', 'web/vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json', 'web/vite.config.ts') }}
       
      - name: Cache Rustup
        uses: actions/cache@v5
        id: cache-rustup
        with:
          path: |
            cache-rustup
          key: ${{ runner.os }}-rustup-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rustup-${{ hashFiles('rust-toolchain.toml') }}

      - name: Cache Cargo
        uses: actions/cache@v5
        id: cache-cargo
        with:
          path: |
            cache-cargo-registry
            cache-cargo-git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Restore Npm cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "cache-npm": {
                "target": "/root/.npm",
                "id": "npm"
              }
            }
          skip-extraction: ${{ steps.cache-npm.outputs.cache-hit }}
          
      - name: Restore Node cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "cache-node": {
                "target": "/web/node_modules/.cache",
                "id": "node"
              },
              "cache-vite": {
                "target": "/web/node_modules/.vite",
                "id": "vite"
              }
            }
          skip-extraction: ${{ steps.cache-node.outputs.cache-hit }}

      - name: Restore Rust cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "cache-rustup": {
                "target": "/usr/local/rustup",
                "id": "rustup"
              }
            }
          skip-extraction: ${{ steps.cache-rustup.outputs.cache-hit }}

      - name: Restore Cargo cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "cache-cargo-registry": {
                "target": "/usr/local/cargo/registry",
                "id": "cargo-registry"
              },
              "cache-cargo-git": {
                "target": "/usr/local/cargo/git/db",
                "id": "cargo-git"
              }
            }
          skip-extraction: ${{ steps.cache-cargo.outputs.cache-hit }}

      - name: Build and push amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            GIT_VERSION=${{ steps.meta.outputs.git_version }}
            GIT_COMMIT_HASH=${{ github.sha }}
            CARGO_JOBS=4
          push: true
          tags: ${{ steps.meta.outputs.tags }}