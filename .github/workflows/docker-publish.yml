name: Build and Push

on:
  push:
    branches: [ "master", "eo-dev" , "eo-dev-*" ]
    tags: [ "eo-v*.*.*" ]

  workflow_dispatch:
    inputs:
      forced_runner:
        description: 'Choose runner'
        required: true
        default: 'self-hosted'
        type: choice
        options:
          - 'self-hosted'
          - 'ubuntu-latest'

env:
  REGISTRY: ghcr.io

# One build per branch or tag: a newer push supersedes the older one instead
# of queueing a second full build behind it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The `web` crate expansion peaks near 12GB of RAM, so the build needs the self-hosted runner.
    runs-on: ${{ github.event.inputs.forced_runner || 'self-hosted' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Determine the source tag
        id: meta
        run: |
          # Tags are fetched above, so this resolves to the upstream tag the
          # branch sits on (e.g. v1.1.2). `.git` is excluded from the Docker
          # context, so this value must be handed in explicitly for
          # src/config/build.rs to bake it into the binary.
          GIT_VERSION=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "v0.0.0")
          echo "git_version=$GIT_VERSION" >> $GITHUB_OUTPUT
          echo "Using GIT_VERSION: $GIT_VERSION"

          # The registry rejects a repository name with uppercase letters, and
          # the shell is not necessarily bash, so the name is lowered with tr.
          IMAGE_NAME=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "$GITHUB_SHA" | cut -c1-8)
          echo "image=${{ env.REGISTRY }}/$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "Image: ${{ env.REGISTRY }}/$IMAGE_NAME, sha: $SHA_SHORT"

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Node
        uses: actions/cache@v6
        id: cache-npm
        with:
          path: |
            cache-npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}

      - name: Cache Node modules
        uses: actions/cache@v6
        id: cache-node
        with:
          path: |
            cache-node
            cache-vite
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json', 'web/vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json', 'web/vite.config.ts') }}

      - name: Cache Rustup
        uses: actions/cache@v6
        id: cache-rustup
        with:
          path: |
            cache-rustup
          key: ${{ runner.os }}-rustup-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rustup-${{ hashFiles('rust-toolchain.toml') }}

      - name: Cache Cargo
        uses: actions/cache@v6
        id: cache-cargo
        with:
          path: |
            cache-cargo-registry
            cache-cargo-git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Restore Npm cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "cache-npm": {
                "target": "/root/.npm",
                "id": "npm"
              }
            }
          skip-extraction: ${{ steps.cache-npm.outputs.cache-hit }}

      - name: Restore Node cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "cache-node": {
                "target": "/web/node_modules/.cache",
                "id": "node"
              },
              "cache-vite": {
                "target": "/web/node_modules/.vite",
                "id": "vite"
              }
            }
          skip-extraction: ${{ steps.cache-node.outputs.cache-hit }}

      - name: Restore Rust cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "cache-rustup": {
                "target": "/usr/local/rustup",
                "id": "rustup"
              }
            }
          skip-extraction: ${{ steps.cache-rustup.outputs.cache-hit }}

      - name: Restore Cargo cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "cache-cargo-registry": {
                "target": "/usr/local/cargo/registry",
                "id": "cargo-registry"
              },
              "cache-cargo-git": {
                "target": "/usr/local/cargo/git/db",
                "id": "cargo-git"
              }
            }
          skip-extraction: ${{ steps.cache-cargo.outputs.cache-hit }}

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            GIT_VERSION=${{ steps.meta.outputs.git_version }}
            GIT_COMMIT_HASH=${{ github.sha }}
            CARGO_JOBS=4
          push: true
          # Only the immutable commit tag is published here. The moving tags
          # (`latest`, `dev`, `nightly`) and the release tag are attached to
          # this same image afterwards, so one build serves all of them.
          tags: ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha_short }}

  publish:
    # Attaches the moving and release tags to an image that was already built
    # for this commit. A release tag therefore costs no extra build.
    needs: build
    if: ${{ always() && needs.build.result != 'cancelled' }}
    runs-on: ${{ github.event.inputs.forced_runner || 'self-hosted' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Attach the tags to the built image
        run: |
          IMAGE_NAME=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/$IMAGE_NAME"
          SHA_SHORT=$(echo "$GITHUB_SHA" | cut -c1-8)
          SOURCE="$IMAGE:sha-$SHA_SHORT"

          TAG_ARGS=()
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/eo-v* ]]; then
            VERSION_RAW="${REF#refs/tags/eo-v}"
            TAG_ARGS+=(-t "$IMAGE:$VERSION_RAW")
            if [[ "$VERSION_RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              TAG_ARGS+=(-t "$IMAGE:latest")
            fi
          elif [[ "$REF" == refs/heads/master ]]; then
            TAG_ARGS+=(-t "$IMAGE:latest")
          elif [[ "$REF" == refs/heads/eo-dev ]]; then
            TAG_ARGS+=(-t "$IMAGE:dev" -t "$IMAGE:nightly")
          fi

          if [[ ${#TAG_ARGS[@]} -eq 0 ]]; then
            echo "No additional tags for $REF"
            exit 0
          fi

          echo "Attaching: ${TAG_ARGS[*]}"
          # `imagetools create` copies the manifest under a new tag without
          # rebuilding the image.
          docker buildx imagetools create "${TAG_ARGS[@]}" "$SOURCE"
          echo "Published: ${TAG_ARGS[*]}"
