[package]
name = "oidc"
version = "0.1.0"
edition = "2024"

[dependencies]
fred = { version = "10.1.0", optional = true }
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "ring",
], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query"] }
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-sessions = { version = "0.14" }
tower-sessions-redis-store = { version = "0.16", optional = true }
http = "1"
cookie = "0.18"
time = { version = "0.3", default-features = false, features = ["parsing", "formatting", "serde", "serde-well-known"] }

openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

db = { workspace = true }
config = { workspace = true }
common = { workspace = true }
infra = { workspace = true }
chrono = { workspace = true }

serde.workspace = true
serde_json.workspace = true
dotenvy.workspace = true
anyhow.workspace = true
thiserror.workspace = true
arc-swap.workspace = true
async-trait.workspace = true
once_cell = "1"
tokio.workspace = true
log.workspace = true
base64.workspace = true
regex.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
serde_json.workspace = true
serial_test = "3"

[features]
default = []
redis-session = [
    "dep:tower-sessions-redis-store",
    "dep:fred",
    "dep:rustls",
    "fred/enable-rustls-ring",
]
