version: '3.8'

services:
  exposedobserve:
    # Build it first with build.sh
    image: exposedobserve:local
    ports:
      - "5080:5080"
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - exposedobserve_data:/data
    environment:
      - RUST_LOG=info,oidc=debug
      - OIDC_SESSION_NAME=EO-Session-Redis
      - OIDC_SESSION_STORE=Redis
      - OIDC_REDIS_URL=redis://localhost:6379
      - OIDC_SESSION_KEY=a3f1c8e7b2d4f6a9c0e2d5f8a1b3c5e7d9f0a2c4e6b8d0f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2d5f8a1b3c5e7d9f0a2c4e6b8d0f2a4c6e8b0d2f4a6c8
      - ZO_ROOT_USER_EMAIL=root@example.com
      - ZO_ROOT_USER_PASSWORD=Complexpass#123
      - ZO_MAX_FILE_SIZE_ON_DISK=32
      - ZO_FILE_PUSH_INTERVAL=10
      - ZO_LOCAL_MODE=false
      - OIDC_ISSUER_URL=http://localhost:8181/default
      - OIDC_REVOCATION_URL=http://localhost:8181/default/revoke
      - OIDC_CLIENT_ID=default
      - OIDC_CLIENT_SECRET=oauth2-test-secret
      - OIDC_REDIRECT_URL=http://localhost:5080/auth/callback
      - OIDC_INSECURE=true
      - OIDC_ORG_CLAIM=groups
      - OIDC_COOKIE_MAX_AGE_SEC=60
      - OIDC_CALLBACK_URL=http://localhost:5080/web/cb
      - ZO_S3_PROVIDER=other
      - ZO_S3_SERVER_URL=http://localhost:8333
      - ZO_S3_ACCESS_KEY=some-access
      - ZO_S3_SECRET_KEY=some-secret
      - ZO_S3_BUCKET_NAME=exposedobserve
      - ZO_S3_REGION_NAME=us-east-1
      - ZO_META_STORE=postgres
      - ZO_META_POSTGRES_DSN=postgres://exposedobserve:exposedobserve@localhost:5432/exposedobserve
      - ZO_NATS_REPLICAS=1
      - ZO_ENRICHMENT_TABLE_MERGE_INTERVAL=10
      - ZO_ENRICHMENT_TABLE_MERGE_THRESHOLD_MB=1
    depends_on:
      seaweedfs:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      mock-oauth2-server:
        condition: service_started
      db:
        condition: service_started
      redis:
        condition: service_started
      nats:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  redis:
    image: redis:8.4
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.0
    ports:
      - "8181:8181"
    environment:
      - SERVER_PORT=8181
      - JSON_CONFIG_PATH=/config/config.json
    volumes:
      - ./docker/mock-oauth2-config.json:/config/config.json
    restart: unless-stopped
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: exposedobserve
      POSTGRES_PASSWORD: exposedobserve
      POSTGRES_DB: exposedobserve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  nats:
    image: nats:2.10
    command: ["-js", "-m", "8222"] 
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
  seaweedfs:
    image: chrislusf/seaweedfs:4.07
    restart: unless-stopped
    ports:
      - "9333:9333" # Master
      - "8080:8080" # Volume / Dashboard
      - "8888:8888" # Filer
      - "8333:8333" # S3
      - "23646:23646" # Admin UI
    command: "server -dir=/data -s3 -filer -ip.bind=0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - seaweed_data:/data
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.07
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        echo 'SeaweedFS is healthy! Creating bucket exposedobserve...' && 
        echo 's3.bucket.create -name exposedobserve' | weed shell -master=seaweedfs:9333 &&
        echo 'Bucket created!'
      "
volumes:
  exposedobserve_data:
  redis_data:
  postgres_data:
  nats_data:
  seaweed_data: