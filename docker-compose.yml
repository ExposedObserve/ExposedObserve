version: '3.8'

services:
  redis:
    image: redis:8.4
    ports:
      - "6379:6379"
  exposedobserve:
    image: exposedobserve:local
    ports:
      - "5080:5080"
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - ./data:/data
    environment:
      - RUST_LOG=info,oidc=debug
      - OIDC_SESSION_NAME=EO-Session-Redis
      - OIDC_SESSION_STORE=Redis
      - OIDC_REDIS_URL=redis://localhost:6379
      - OIDC_SESSION_KEY=a3f1c8e7b2d4f6a9c0e2d5f8a1b3c5e7d9f0a2c4e6b8d0f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2d5f8a1b3c5e7d9f0a2c4e6b8d0f2a4c6e8b0d2f4a6c8
      - ZO_ROOT_USER_EMAIL=root@example.com
      - ZO_ROOT_USER_PASSWORD=Complexpass#123
      - ZO_MAX_FILE_SIZE_ON_DISK=32
      - ZO_FILE_PUSH_INTERVAL=10
      - ZO_LOCAL_MODE=true
      - ZO_DATA_DIR=/data
      - OIDC_ISSUER_URL=http://localhost:8080/default
      - OIDC_REVOCATION_URL=http://localhost:8080/default/revoke
      - OIDC_CLIENT_ID=default
      - OIDC_CLIENT_SECRET=oauth2-test-secret
      - OIDC_REDIRECT_URL=http://localhost:5080/auth/callback
      - OIDC_INSECURE=true
      - OIDC_ORG_CLAIM=groups
      - OIDC_COOKIE_MAX_AGE_SEC=60
      - OIDC_CALLBACK_URL=http://localhost:5080/web/cb
    depends_on:
      - mock-oauth2-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.0
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - JSON_CONFIG_PATH=/config/config.json
    volumes:
      - ./docker/mock-oauth2-config.json:/config/config.json
    restart: unless-stopped
