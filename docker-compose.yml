services:
  exposedobserve:
    # Build it first with build.sh
    image: exposedobserve:local
    ports:
      - "5080:5080"
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - exposedobserve_data:/data
    environment:
      - RUST_LOG=info,oidc=debug
      - OIDC_SESSION_NAME=EO-Session-Redis
      # Store selection is NOT an env var: the Redis store is chosen purely from
      # a non-empty OIDC_REDIS_URL (src/oidc/src/config.rs, RedisConfig::is_enabled)
      # and additionally needs the `redis-session` Cargo feature. Comment this out
      # to fall back to in-memory sessions.
      - OIDC_REDIS_URL=redis://redis:6379
      # base64 of 64 bytes, decoded with base64::STANDARD by src/oidc/src/config.rs;
      # a hex string fails to decode and silently falls back to the all-zero
      # default key. Generate with: openssl rand -base64 64
      - OIDC_SESSION_KEY=GuKtOdjEAXI4Ti1vnxAznw0/1H8J2KtwRsSOrLq5yUo4RuSIyyLgDUn0IuGLXOKhjUFXEKoqKHW1fRZsCWPtSQ==
      - ZO_ROOT_USER_EMAIL=root@example.com
      - ZO_ROOT_USER_PASSWORD=Complexpass#123
      # required on a new install: 16 to 48 random bytes, e.g. `openssl rand -hex 24`
      - ZO_EXT_AUTH_SALT=0c1c92aea89721b2320ac50e7d12c93437a484e4a235e843
      - ZO_MAX_FILE_SIZE_ON_DISK=32
      - ZO_FILE_PUSH_INTERVAL=10
      - ZO_LOCAL_MODE=false
      - OIDC_ISSUER_URL=http://mock-oauth2-server:8181/default
      - OIDC_CLIENT_ID=default
      - OIDC_CLIENT_SECRET=oauth2-test-secret
      # the real callback route is /auth/sso/callback (oidc::handlers::sso_routes)
      - OIDC_REDIRECT_URL=http://localhost:5080/auth/sso/callback
      - OIDC_INSECURE=true
      - OIDC_ORG_CLAIM=groups
      - OIDC_COOKIE_MAX_AGE_SEC=60
      # SPA landing path the browser is sent to after the IdP round trip
      - OIDC_CALLBACK_URL=http://localhost:5080/web/cb
      - ZO_S3_PROVIDER=other
      - ZO_S3_SERVER_URL=http://seaweedfs:8333
      - ZO_S3_ACCESS_KEY=some-access
      - ZO_S3_SECRET_KEY=some-secret
      - ZO_S3_BUCKET_NAME=exposedobserve
      - ZO_S3_REGION_NAME=us-east-1
      - ZO_META_STORE=postgres
      - ZO_META_POSTGRES_DSN=postgres://exposedobserve:exposedobserve@db:5432/exposedobserve
      - ZO_NATS_REPLICAS=1
      - ZO_ENRICHMENT_TABLE_MERGE_INTERVAL=10
      - ZO_ENRICHMENT_TABLE_MERGE_THRESHOLD_MB=1
    depends_on:
      seaweedfs:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      mock-oauth2-server:
        condition: service_started
      db:
        condition: service_started
      redis:
        condition: service_started
      nats:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  redis:
    image: redis:8.4
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.0
    ports:
      - "8181:8181"
    environment:
      - SERVER_PORT=8181
      - JSON_CONFIG_PATH=/config/config.json
    volumes:
      - ./docker/mock-oauth2-config.json:/config/config.json
    restart: unless-stopped
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: exposedobserve
      POSTGRES_PASSWORD: exposedobserve
      POSTGRES_DB: exposedobserve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  nats:
    image: nats:2.10
    command: ["-js", "-m", "8222"] 
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
  seaweedfs:
    image: chrislusf/seaweedfs:4.07
    restart: unless-stopped
    ports:
      - "9333:9333" # Master
      - "8080:8080" # Volume / Dashboard
      - "8888:8888" # Filer
      - "8333:8333" # S3
      - "23646:23646" # Admin UI
    command: "server -dir=/data -s3 -filer -ip.bind=0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - seaweed_data:/data
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.07
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        echo 'SeaweedFS is healthy! Creating bucket exposedobserve...' && 
        echo 's3.bucket.create -name exposedobserve' | weed shell -master=seaweedfs:9333 &&
        echo 'Bucket created!'
      "
volumes:
  exposedobserve_data:
  redis_data:
  postgres_data:
  nats_data:
  seaweed_data: